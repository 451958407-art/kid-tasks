<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 小朋友任务打卡</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">🌟</div>
      <h1 id="title">登录</h1>

      <!-- 登录表单 -->
      <form id="loginForm">
        <label>邮箱 <small style="color:#999">(或用户名)</small></label>
        <input id="loginEmail" type="text" required autocomplete="username" placeholder="家长: your@email.com / 小朋友: 用户名" />
        <label>密码</label>
        <input id="loginPassword" type="password" required minlength="6" autocomplete="current-password" />
        <button type="submit">登录</button>
        <p class="switch">
          <a href="#" id="toRegister">注册新家庭</a>
          <span style="margin:0 6px;color:#ccc">|</span>
          <a href="#" id="toJoin">加入已有家庭</a>
        </p>
        <p class="switch" style="margin-top:6px">
          <a href="#" id="toForgot" style="color:#888">忘记密码?</a>
        </p>
      </form>

      <!-- 注册新家庭表单 -->
      <form id="registerForm" style="display:none">
        <label>家庭名称</label>
        <input id="regFamilyName" type="text" required maxlength="30" placeholder="例如: 快乐一家" />
        <label>你的昵称 (家长)</label>
        <input id="regDisplayName" type="text" required maxlength="20" placeholder="例如: 妈妈" />
        <label>邮箱</label>
        <input id="regEmail" type="email" required autocomplete="email" />
        <label>密码 (至少 6 位)</label>
        <input id="regPassword" type="password" required minlength="6" autocomplete="new-password" />
        <button type="submit">创建家庭</button>
        <p class="switch"><a href="#" class="toLogin">已有账号? 直接登录</a></p>
      </form>

      <!-- 加入已有家庭表单 -->
      <form id="joinForm" style="display:none">
        <label>邀请码 (6 位, 找家长要)</label>
        <input id="joinCode" type="text" required maxlength="6" placeholder="例如: A3F7K2" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:20px" />
        <label>你的昵称</label>
        <input id="joinDisplayName" type="text" required maxlength="20" placeholder="例如: 爸爸 / 小小" />
        <label>你的身份</label>
        <select id="joinRole" required>
          <option value="parent">家长 (可以管理任务)</option>
          <option value="kid">小朋友 (只能打卡)</option>
        </select>
        <label>邮箱 <small style="color:#999">(小朋友没邮箱可以只填用户名, 如 xiaobao)</small></label>
        <input id="joinEmail" type="text" required autocomplete="username" placeholder="家长: your@email.com / 小朋友: 用户名" />
        <label>密码 (至少 6 位)</label>
        <input id="joinPassword" type="password" required minlength="6" autocomplete="new-password" />
        <button type="submit">加入家庭</button>
        <p class="switch"><a href="#" class="toLogin">已有账号? 直接登录</a></p>
      </form>

      <!-- 忘记密码表单 -->
      <form id="forgotForm" style="display:none">
        <label>输入你的邮箱, 收到重置链接后可设新密码</label>
        <input id="forgotEmail" type="email" required autocomplete="email" placeholder="your@email.com" />
        <p class="hint" style="font-size:12px;color:#999;margin:6px 0">仅限家长(用邮箱注册的)。小朋友账号请让家长在"家庭面板"里帮忙重置。</p>
        <button type="submit">发送重置邮件</button>
        <p class="switch"><a href="#" class="toLogin">回到登录</a></p>
      </form>

      <p id="msg" class="msg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/auth.js?v=8"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (text, isError) => {
      const m = $("msg");
      m.textContent = text;
      m.className = "msg " + (isError ? "err" : "ok");
    };

    Auth.getSession().then((s) => { if (s) location.href = "index.html"; });

    function showForm(id, title) {
      ["loginForm", "registerForm", "joinForm", "forgotForm"].forEach((f) => {
        $(f).style.display = f === id ? "block" : "none";
      });
      $("title").textContent = title;
      msg("", false);
    }

    $("toRegister").onclick = (e) => { e.preventDefault(); showForm("registerForm", "注册新家庭"); };
    $("toJoin").onclick = (e) => { e.preventDefault(); showForm("joinForm", "加入已有家庭"); };
    $("toForgot").onclick = (e) => { e.preventDefault(); showForm("forgotForm", "忘记密码"); };
    document.querySelectorAll(".toLogin").forEach((a) => {
      a.onclick = (e) => { e.preventDefault(); showForm("loginForm", "登录"); };
    });

    // 登录
    $("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      msg("登录中...", false);
      try {
        await Auth.signIn({
          email: $("loginEmail").value.trim(),
          password: $("loginPassword").value,
        });
        location.href = "index.html";
      } catch (err) {
        msg(err.message || "登录失败", true);
      }
    };

    // 创建新家庭
    $("registerForm").onsubmit = async (e) => {
      e.preventDefault();
      msg("创建家庭中...", false);
      try {
        const result = await Auth.signUpParent({
          email: $("regEmail").value.trim(),
          password: $("regPassword").value,
          familyName: $("regFamilyName").value.trim(),
          displayName: $("regDisplayName").value.trim(),
        });
        if (result.session) {
          location.href = "index.html";
        } else {
          msg("请到邮箱查收验证邮件后再登录", false);
        }
      } catch (err) {
        msg(err.message || "注册失败", true);
      }
    };

    // 加入已有家庭
    $("joinForm").onsubmit = async (e) => {
      e.preventDefault();
      msg("加入家庭中...", false);
      try {
        const result = await Auth.signUpJoin({
          email: $("joinEmail").value.trim(),
          password: $("joinPassword").value,
          joinCode: $("joinCode").value.trim().toUpperCase(),
          displayName: $("joinDisplayName").value.trim(),
          role: $("joinRole").value,
        });
        if (result.session) {
          location.href = "index.html";
        } else {
          msg("请到邮箱查收验证邮件后再登录", false);
        }
      } catch (err) {
        msg(err.message || "加入失败, 请检查邀请码", true);
      }
    };

    // 忘记密码
    $("forgotForm").onsubmit = async (e) => {
      e.preventDefault();
      msg("发送中...", false);
      try {
        await Auth.sendPasswordResetEmail($("forgotEmail").value.trim());
        msg("已发送重置邮件, 请查收邮箱(含垃圾邮件夹)", false);
      } catch (err) {
        msg(err.message || "发送失败", true);
      }
    };
  </script>
</body>
</html>
